define host {
  use                     linux-server
  host_name               codigoflow-app
  alias                   CodigoFlow Application
  address                 127.0.0.1
  hostgroups              codigoflow-lab
  check_command           check-host-alive
  max_check_attempts      3
  check_period            24x7
  notification_interval   60
  notification_period     24x7
  contacts                codigoflow-admin
}

define hostgroup {
  hostgroup_name          codigoflow-lab
  alias                   CódigoFlow Lab Hosts
  members                 codigoflow-app
}
