define service {
  use                     generic-service
  host_name               codigoflow-app
  service_description     HTTP
  check_command           check_http_codigoflow!8080!5!10
  servicegroups           codigoflow-app
  max_check_attempts      3
  check_interval          1
  retry_interval          1
  check_period            24x7
  notification_interval   30
  notification_period     24x7
  contacts                codigoflow-admin
}

define service {
  use                     generic-service
  host_name               codigoflow-app
  service_description     APP
  check_command           check_codigoflow_app
  servicegroups           codigoflow-app
  max_check_attempts      3
  check_interval          1
  retry_interval          1
  check_period            24x7
  contacts                codigoflow-admin
}

define servicegroup {
  servicegroup_name       codigoflow-app
  alias                   CódigoFlow Application Services
  members                 codigoflow-app,HTTP,codigoflow-app,APP
}
