---
- name: Configure server baseline
  hosts: codigoflow
  become: true
  tags: [configure]
  roles:
    - common
  tasks:
    - name: Ensure app user exists
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      tags: [users]

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        mode: "0755"
      loop:
        - "{{ app_root }}"
        - /var/log/codigoflow
      tags: [dirs]
