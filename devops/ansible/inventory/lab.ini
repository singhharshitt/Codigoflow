# CódigoFlow lab inventory — replace IPs with your Ubuntu control/app VMs or WSL hosts.
# Never commit real production credentials.

[management]
codigoflow-mgmt ansible_host=127.0.0.1 ansible_connection=local

[app]
# codigoflow-app ansible_host=192.168.56.11 ansible_user=vagrant

[codigoflow:children]
management
app

[codigoflow:vars]
ansible_python_interpreter=/usr/bin/python3
app_http_port=8080
app_root=/opt/codigoflow/app
