---
- name: Configure CodigoFlow managed server
  hosts: managed
  become: true

  tasks:
    - name: Install essential utilities and Docker
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - unzip
          - ca-certificates
          - python3
          - python3-pip
          - docker.io
        state: present
        update_cache: false

    - name: Ensure Docker is running and enabled
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
