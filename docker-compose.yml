version: '3.9'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - CLIENT_ORIGIN=http://localhost:5173
      - DATABASE_PATH=/app/data/codigoflow.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

# Note: For development, run both services locally without Docker.
# This compose file is provided for reference and production deployment.
